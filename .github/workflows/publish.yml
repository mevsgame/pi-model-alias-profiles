name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing requires a recent npm CLI; npm@11 supports Node 22.
      - name: Install current npm CLI
        run: npm install --global npm@^11.5.1

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $VERSION" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Publish package
        run: npm publish --provenance --access public --tag "$NPM_TAG"
